# Havza ve pilot nokta tanımları.
# synthetic:* alanları YALNIZCA sentetik veri üretimi içindir; gerçek veri
# kullanıldığında yok sayılır. İklim normalleri yaklaşık değerlerdir.
#
# ag_year_start_month: tarım yılının başladığı ay. Hasat yılı etiketi =
# tarım yılının bittiği takvim yılı (Kuzey: Eki Y-1 -> Eyl Y).

konya:
  name_tr: Konya Kapalı Havzası
  name_en: Konya Closed Basin
  country: TR
  currency: TRY
  currency_symbol: "₺"
  ag_year_start_month: 10
  rule_packs: [tr_konya_water_2026, advisory_agronomy]
  water_cost_per_m3: 2.5          # pompa enerjisi, varsayım (TL/m³)
  sustainable_water_fraction: 0.65  # sürdürülebilir çekim / mevcut çekim, varsayım
  map_center: [37.9, 33.0]
  map_zoom: 7
  grace_bbox: [31.5, 36.8, 34.5, 39.2]   # [lon_min, lat_min, lon_max, lat_max]
  facts_tr:
    - "Konya Kapalı Havzası'nda 739 obruk kayıtlı, 702'si Konya'da (AFAD Obruk Duyarlılık Haritası, haberler)."
    - "2020'den bu yana 126 yeni obruk; yalnızca 2024'te 32."
    - "2025 yağışı 244 mm ile Türkiye'nin 25 havzası içinde en düşük."
    - "Yeraltı suyu 1980'lerden bu yana yaklaşık 30 m düştü (Daloğlu Çetinkaya vd., 2025)."
  facts_en:
    - "739 sinkholes recorded in the Konya Closed Basin, 702 of them in Konya (AFAD, news reports)."
    - "126 new sinkholes since 2020; 32 in 2024 alone."
    - "2025 precipitation of 244 mm was the lowest of Türkiye's 25 basins."
    - "Groundwater has dropped about 30 m since the 1980s (Daloğlu Çetinkaya et al., 2025)."
  synthetic:
    tmean: [-0.2, 1.4, 5.6, 10.9, 15.6, 20.0, 23.4, 23.1, 18.6, 12.6, 6.0, 1.5]
    dtr:   [9.0, 10.0, 11.5, 13.0, 14.0, 15.0, 16.0, 16.0, 15.5, 13.5, 11.0, 9.0]
    precip: [37, 30, 31, 34, 43, 24, 7, 5, 11, 30, 33, 42]
    wet_days: [11, 10, 10, 10, 10, 6, 2, 2, 3, 7, 8, 11]
    rh:    [78, 72, 65, 60, 57, 50, 44, 44, 48, 60, 70, 78]
    wind: 2.0
    warming_per_year: 0.035
    dry_years: {1989: 0.55, 2001: 0.65, 2007: 0.60, 2008: 0.65, 2014: 0.62, 2021: 0.68, 2025: 0.72}
    grace_trend_cm_per_year: -1.3
    grace_seasonal_cm: 3.0
    cmip6_precip_ratio: [0.92, 0.86]
    slope_deg: 0.8
    soil: {taw_mm_per_m: 155, clay_pct: 35, sand_pct: 25, soc_g_kg: 9, ph: 8.0}
  sites:
    cumra:
      name: Çumra
      lat: 37.57
      lon: 32.78
      elevation_m: 1013
      irrigated: true
      irrigation_method: sprinkler
      water_restricted: true
      precip_factor: 0.95
      synthetic_history: {2019: wheat, 2020: sugar_beet, 2021: wheat, 2022: maize_grain, 2023: wheat, 2024: chickpea, 2025: sugar_beet, 2026: maize_grain}
    karapinar:
