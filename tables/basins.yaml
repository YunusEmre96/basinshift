      synthetic_history: {2019: maize_grain, 2020: maize_grain, 2021: sugar_beet, 2022: maize_grain, 2023: potato, 2024: maize_grain, 2025: sugar_beet, 2026: maize_grain}
    cihanbeyli:
      name: Cihanbeyli
